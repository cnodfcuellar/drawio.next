<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drawio.next</title>
    <script>
      window.mxBasePath = '/mxgraph';
      window.mxImageBasePath = '/mxgraph/images';
      window.mxLoadResources = false;
      window.mxLoadStylesheets = true;
    </script>
    <script src="/mxgraph/mxClient.js"></script>
    <script>
      // Polyfill para métodos de draw.io esperados por el renderer y handlers de mxClient
      if (window.mxGraph) {
        if (!window.mxGraph.prototype.isSpecialColor) {
          window.mxGraph.prototype.isSpecialColor = function(color) {
            if (!color) return false;
            var special = [
              (window.mxConstants && window.mxConstants.STYLE_STROKECOLOR) || 'strokeColor',
              (window.mxConstants && window.mxConstants.STYLE_FILLCOLOR) || 'fillColor',
              'inherit',
              'swimlane',
              'indicated'
            ];
            return special.indexOf(color) >= 0;
          };
        }

        if (!window.mxGraph.prototype.isPart) {
          window.mxGraph.prototype.isPart = function(cell) {
            if (cell == null) return false;
            var state = (this.view != null && typeof this.view.getState === 'function') ? this.view.getState(cell) : null;
            var style = (state != null) ? state.style : (typeof this.getCellStyle === 'function' ? this.getCellStyle(cell) : null);
            return (style && style['part'] == '1') || false;
          };
        }

        if (!window.mxGraph.prototype.getCompositeParent) {
          window.mxGraph.prototype.getCompositeParent = function(cell) {
            while (cell != null && typeof this.isPart === 'function' && this.isPart(cell)) {
              var model = typeof this.getModel === 'function' ? this.getModel() : this.model;
              var temp = model != null ? model.getParent(cell) : null;
              if (!model || typeof model.isVertex !== 'function' || !model.isVertex(temp)) {
                break;
              }
              cell = temp;
            }
            return cell;
          };
        }

        if (!window.mxGraph.prototype.getCompositeParents) {
          window.mxGraph.prototype.getCompositeParents = function(cells) {
            if (cells == null) return [];
            var lookup = {};
            var newCells = [];
            for (var i = 0; i < cells.length; i++) {
              var cell = this.getCompositeParent(cells[i]);
              if (cell != null && !lookup[cell.id]) {
                lookup[cell.id] = true;
                newCells.push(cell);
              }
            }
            return newCells;
          };
        }
      }
      window.Editor = window.Editor || { sketchDefaultJiggle: 1 };
      window.Graph = window.Graph || window.mxGraph;
    </script>
    <script src="/mxgraph/Shapes.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
