<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drawio.next</title>
    <script>
      window.mxBasePath = '/mxgraph';
      window.mxImageBasePath = '/mxgraph/images';
      window.mxLoadResources = false;
      window.mxLoadStylesheets = true;
    </script>
    <script src="/mxgraph/mxClient.js"></script>
    <script>
      // Polyfill para métodos de draw.io esperados por el renderer de mxClient
      if (window.mxGraph && !window.mxGraph.prototype.isSpecialColor) {
        window.mxGraph.prototype.isSpecialColor = function(color) {
          if (!color) return false;
          var special = [
            (window.mxConstants && window.mxConstants.STYLE_STROKECOLOR) || 'strokeColor',
            (window.mxConstants && window.mxConstants.STYLE_FILLCOLOR) || 'fillColor',
            'inherit',
            'swimlane',
            'indicated'
          ];
          return special.indexOf(color) >= 0;
        };
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
