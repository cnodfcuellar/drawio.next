<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 1100" width="100%" height="100%" style="background:#090d16; font-family:'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <!-- Filtros de sombra y efectos de brillo -->
    <filter id="glowCircle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Gradientes de fase orbital -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="75%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Flechas de flujo -->
    <marker id="flowArrow" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="flowArrowGreen" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#34d399" />
    </marker>
    <marker id="flowArrowAmber" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- ================= TÍTULO ================= -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" font-size="25" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
      DIAGRAMA DE FLUJO CIRCULAR / ORBITAL: ARRANQUE DE DRAW.IO
    </text>
    <text x="0" y="24" font-size="13" fill="#94a3b8">
      Trayectoria cíclica desde el primer byte cargado por el navegador hasta la reactividad continua del Canvas
    </text>
  </g>

  <!-- ================= NÚCLEO CENTRAL (CORE ENGINE) ================= -->
  <g transform="translate(675, 540)">
    <!-- Ondas concéntricas de fondo -->
    <circle r="410" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6"/>
    <circle r="320" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle r="220" fill="none" stroke="#334155" stroke-width="1.5"/>

    <!-- Núcleo Central: mxGraphModel & View -->
    <circle r="115" fill="#0f172a" stroke="url(#orbitGrad)" stroke-width="4" filter="url(#glowCircle)"/>
    <circle r="90" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    
    <text x="0" y="-35" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="0.8">CORE ENGINE</text>
    <text x="0" y="-12" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">mxGraph</text>
    <text x="0" y="10" font-size="12" fill="#cbd5e1" text-anchor="middle">mxGraphModel</text>
    <text x="0" y="28" font-size="11" fill="#818cf8" text-anchor="middle">&lt;mxCell id="0" / id="1"&gt;</text>
    <text x="0" y="46" font-size="10" fill="#94a3b8" text-anchor="middle">Árbol de celdas en memoria</text>
  </g>

  <!-- ================= ANILLO GUÍA CIRCULAR CONECTOR ================= -->
  <!-- R = 360 px alrededor del centro (675, 540) -->
  <path d="M 675 180 A 360 360 0 1 1 674.5 180" fill="none" stroke="url(#orbitGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 8" opacity="0.45"/>

  <!-- ================= ETAPA 1 (NORD-OESTE / TOP-LEFT): 300° ================= -->
  <!-- Coordenada aprox centro: cx = 675 - 360*sin(60°) = 363, cy = 540 - 360*cos(60°) = 228 -->
  <g transform="translate(140, 160)" filter="url(#cardGlow)">
    <rect width="320" height="150" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <rect width="320" height="28" rx="12" fill="#0369a1"/>
    <circle cx="20" cy="14" r="9" fill="#38bdf8"/>
    <text x="20" y="18" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle">1</text>
    <text x="38" y="19" font-size="12" font-weight="700" fill="#ffffff">CARGA DOM &amp; BOOTSTRAP</text>
    
    <g transform="translate(15, 42)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#38bdf8">index.html ➔ bootstrap.js</text>
      <text x="0" y="32" font-size="11" fill="#cbd5e1">• Carga contenedor <tspan fill="#facc15">#geInfo</tspan> con spinner.</text>
      <text x="0" y="48" font-size="11" fill="#cbd5e1">• <tspan fill="#38bdf8">parseUrlParams()</tspan> construye params.</text>
      <text x="0" y="64" font-size="11" fill="#cbd5e1">• Decodifica hash de CDN <tspan fill="#facc15">#P{...}</tspan>.</text>
      <text x="0" y="80" font-size="10" fill="#64748b">• Detecta runtime: mxIsElectron.</text>
    </g>
  </g>
  <!-- Flecha de Etapa 1 a Etapa 2 (en la órbita) -->
  <path d="M 465 240 Q 675 140 885 240" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flowArrow)"/>
  <text x="675" y="165" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">window.load</text>


  <!-- ================= ETAPA 2 (NORD-ESTE / TOP-RIGHT): 60° ================= -->
  <!-- Coordenada aprox centro: cx = 675 + 360*sin(60°) = 987, cy = 540 - 360*cos(60°) = 228 -->
  <g transform="translate(890, 160)" filter="url(#cardGlow)">
    <rect width="320" height="150" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
    <rect width="320" height="28" rx="12" fill="#4338ca"/>
    <circle cx="20" cy="14" r="9" fill="#818cf8"/>
    <text x="20" y="18" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle">2</text>
    <text x="38" y="19" font-size="12" font-weight="700" fill="#ffffff">DISPARO &amp; ENTRADA APP</text>
    
    <g transform="translate(15, 42)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#818cf8">main.js ➔ App.main()</text>
      <text x="0" y="32" font-size="11" fill="#cbd5e1">• Evento <tspan fill="#34d399">'load'</tspan> confirma Canvas HTML5.</text>
      <text x="0" y="48" font-size="11" fill="#cbd5e1">• Invoca el gatillo <tspan fill="#818cf8">App.main()</tspan>.</text>
      <text x="0" y="64" font-size="11" fill="#cbd5e1">• Carga diccionarios <tspan fill="#34d399">mxResources</tspan> (i18n).</text>
      <text x="0" y="80" font-size="10" fill="#64748b">• Instancia var editor = new Editor().</text>
    </g>
  </g>
  <!-- Flecha de Etapa 2 a Etapa 3 (en la órbita) -->
  <path d="M 1050 315 Q 1120 480 1050 630" fill="none" stroke="#818cf8" stroke-width="2.5" marker-end="url(#flowArrow)"/>
  <text x="1115" y="475" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle">EditorUi.call()</text>


  <!-- ================= ETAPA 3 (SUD-ESTE / BOTTOM-RIGHT): 120° ================= -->
  <!-- Coordenada aprox centro: cx = 675 + 360*sin(60°) = 987, cy = 540 + 360*cos(60°) = 852 -->
  <g transform="translate(890, 640)" filter="url(#cardGlow)">
    <rect width="320" height="155" rx="12" fill="#0f172a" stroke="#059669" stroke-width="2"/>
    <rect width="320" height="28" rx="12" fill="#047857"/>
    <circle cx="20" cy="14" r="9" fill="#34d399"/>
    <text x="20" y="18" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle">3</text>
    <text x="38" y="19" font-size="12" font-weight="700" fill="#ffffff">CONSTRUCCIÓN DE INTERFAZ</text>
    
    <g transform="translate(15, 42)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#34d399">EditorUi.js / Sidebar / Format</text>
      <text x="0" y="32" font-size="11" fill="#cbd5e1">• <tspan fill="#34d399">Menus.js</tspan> &amp; <tspan fill="#34d399">Toolbar.js</tspan> (Barra superior).</text>
      <text x="0" y="48" font-size="11" fill="#cbd5e1">• <tspan fill="#34d399">Sidebar.js</tspan>: genera miniaturas SVG.</text>
      <text x="0" y="64" font-size="11" fill="#cbd5e1">• <tspan fill="#34d399">Format.js</tspan>: panel de estilos reactivo.</text>
      <text x="0" y="80" font-size="10" fill="#64748b">• Pages.js: gestión de pestañas múltiples.</text>
    </g>
  </g>
  <!-- Flecha de Etapa 3 a Etapa 4 (en la órbita) -->
  <path d="M 885 790 Q 675 880 465 790" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#flowArrowGreen)"/>
  <text x="675" y="855" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">openFile() / XML</text>


  <!-- ================= ETAPA 4 (SUD-OESTE / BOTTOM-LEFT): 240° ================= -->
  <!-- Coordenada aprox centro: cx = 675 - 360*sin(60°) = 363, cy = 540 + 360*cos(60°) = 852 -->
  <g transform="translate(140, 640)" filter="url(#cardGlow)">
    <rect width="320" height="155" rx="12" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
    <rect width="320" height="28" rx="12" fill="#b45309"/>
    <circle cx="20" cy="14" r="9" fill="#fbbf24"/>
    <text x="20" y="18" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle">4</text>
    <text x="38" y="19" font-size="12" font-weight="700" fill="#ffffff">PARSING XML &amp; SHADOW PAGES</text>
    
    <g transform="translate(15, 42)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#fbbf24">DrawioFile.js ➔ mxCodec</text>
      <text x="0" y="32" font-size="11" fill="#cbd5e1">• Carga DriveFile, GitHubFile o LocalFile.</text>
      <text x="0" y="48" font-size="11" fill="#cbd5e1">• <tspan fill="#fbbf24">parseXml()</tspan> crea <tspan fill="#facc15">shadowPages</tspan>.</text>
      <text x="0" y="64" font-size="11" fill="#cbd5e1">• <tspan fill="#fbbf24">mxCodec.decode()</tspan> genera celdas.</text>
      <text x="0" y="80" font-size="10" fill="#64748b">• Prepara base para sincronización 3-Way.</text>
    </g>
  </g>
  <!-- Flecha de Etapa 4 hacia el Core y hacia Etapa 1 (cerrando el ciclo) -->
  <path d="M 290 635 Q 230 480 290 315" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#flowArrowAmber)"/>
  <text x="235" y="475" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">beginUpdate()</text>


  <!-- ================= RADIOS DIRECTOS AL NÚCLEO (CONVERGENCIA) ================= -->
  <!-- De Etapa 2 al Core (Creación de Modelo) -->
  <line x1="890" y1="285" x2="775" y2="455" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#flowArrow)"/>
  <text x="855" y="375" font-size="10" fill="#818cf8" transform="rotate(35, 855, 375)">new Graph()</text>

  <!-- De Etapa 4 al Core (Inyección de XML) -->
  <line x1="460" y1="675" x2="575" y2="600" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#flowArrowAmber)"/>
  <text x="495" y="625" font-size="10" fill="#fbbf24" transform="rotate(-30, 495, 625)">setGraphXml()</text>

  <!-- Salida del Core al Canvas (Renderizado final) -->
  <path d="M 675 660 L 675 880" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#flowArrowGreen)"/>
  <rect x="525" y="890" width="300" height="70" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1.8" filter="url(#cardGlow)"/>
  <text x="675" y="915" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">5. RENDERIZADO SVG &amp; CANVAS</text>
  <text x="675" y="934" font-size="11" fill="#a7f3d0" text-anchor="middle">mxSvgCanvas2D dibuja formas en pantalla.</text>
  <text x="675" y="949" font-size="10" fill="#6ee7b7" text-anchor="middle">Spinner #geInfo desaparece ➔ Estado Interactivo listo.</text>

  <!-- ================= BUCLE ORBITAL PERPETUO (AUTOSAVE) ================= -->
  <g transform="translate(675, 1000)">
    <rect x="-420" y="0" width="840" height="42" rx="8" fill="#111827" stroke="#374151"/>
    <circle cx="-400" cy="21" r="5" fill="#f43f5e"/>
    <text x="-385" y="25" font-size="11" font-weight="700" fill="#f43f5e">BUCLE PERPETUO POST-ARRANQUE:</text>
    <text x="-160" y="25" font-size="11" fill="#cbd5e1">
      Modificación de Celda ➔ <tspan fill="#38bdf8">mxEvent.CHANGE</tspan> ➔ <tspan fill="#818cf8">setModified(true)</tspan> ➔ <tspan fill="#fbbf24">autosaveDelay</tspan> en DrawioFile ➔ Sincronización continua en la nube.
    </text>
  </g>
</svg>