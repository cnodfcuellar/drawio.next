<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1200" width="100%" height="100%" style="background:#070b14; font-family:'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <!-- Filtros de resplandor y sombras -->
    <filter id="meshShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="hubGlowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="hubGlowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradientes de Cabecera y Nodos -->
    <linearGradient id="headerMeshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Marcadores de Flechas de Dependencia -->
    <marker id="depCyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
    </marker>
    <marker id="depIndigo" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#818cf8"/>
    </marker>
    <marker id="depGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399"/>
    </marker>
    <marker id="depAmber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/>
    </marker>
    <marker id="depRose" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fb7185"/>
    </marker>
  </defs>

  <!-- ================= ENCABEZADO ================= -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" font-size="26" font-weight="800" fill="url(#headerMeshGrad)" letter-spacing="0.5">
      PUNTO 7: TOPOLOGÍA DE RED Y MALLA DE DEPENDENCIAS CRUZADAS
    </text>
    <text x="0" y="24" font-size="13" fill="#94a3b8">
      Mapa de interconexión viva: Quién invoca a quién, qué módulos importan librerías y cómo se retroalimentan las dependencias
    </text>
  </g>

  <!-- ================= LEYENDA TÉCNICA SUPERIOR ================= -->
  <g transform="translate(60, 95)">
    <rect width="1560" height="38" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" font-size="11" font-weight="700" fill="#facc15">TIPOLOGÍA DE ENLACES:</text>
    
    <line x1="170" y1="20" x2="200" y2="20" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#depCyan)"/>
    <text x="208" y="24" font-size="11" fill="#e2e8f0">Orquestación Superior (App.js)</text>

    <line x1="430" y1="20" x2="460" y2="20" stroke="#818cf8" stroke-width="2.5" marker-end="url(#depIndigo)"/>
    <text x="468" y="24" font-size="11" fill="#e2e8f0">Composición de UI (EditorUi)</text>

    <line x1="680" y1="20" x2="710" y2="20" stroke="#34d399" stroke-width="2.5" marker-end="url(#depGreen)"/>
    <text x="718" y="24" font-size="11" fill="#e2e8f0">Motor Gráfico (mxGraph / Model)</text>

    <line x1="940" y1="20" x2="970" y2="20" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#depAmber)"/>
    <text x="978" y="24" font-size="11" fill="#e2e8f0">Persistencia &amp; Sync (DrawioFile)</text>

    <line x1="1200" y1="20" x2="1230" y2="20" stroke="#fb7185" stroke-width="2.5" marker-end="url(#depRose)"/>
    <text x="1238" y="24" font-size="11" fill="#e2e8f0">Llamada REST / Servlets Java</text>
  </g>


  <!-- ================= LÍNEAS DE INTERCONEXIÓN / MALLA DE LA RED ================= -->
  <!-- 1. bootstrap.js ➔ index.html (Entorno) -->
  <path d="M 230 240 L 230 330" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#depCyan)"/>
  <!-- 2. main.js ➔ App.js (Disparo) -->
  <path d="M 330 375 L 530 450" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#depCyan)"/>
  <!-- 3. App.js ➔ EditorUi.js (Composición UI) -->
  <path d="M 670 480 L 870 360" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#depIndigo)"/>
  <!-- 4. App.js ➔ Editor.js (Contenedor Grafo) -->
  <path d="M 640 520 L 710 650" fill="none" stroke="#818cf8" stroke-width="2.5" marker-end="url(#depIndigo)"/>
  <!-- 5. App.js ➔ DrawioFile.js (Persistencia) -->
  <path d="M 640 500 L 760 880" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#depAmber)"/>
  <!-- 6. App.js ➔ Clientes Nube (DriveClient, GitHubClient...) -->
  <path d="M 540 530 L 400 780" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#depCyan)"/>

  <!-- 7. EditorUi.js ➔ Menus.js / Sidebar.js / Format.js (Paneles satélite) -->
  <path d="M 980 310 L 1150 220" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#depIndigo)"/>
  <path d="M 1000 350 L 1180 320" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#depIndigo)"/>
  <path d="M 980 390 L 1150 430" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#depIndigo)"/>

  <!-- 8. Editor.js ➔ Graph.js (Extensión) -->
  <path d="M 850 710 L 980 710" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#depGreen)"/>
  <!-- 9. Graph.js ➔ mxGraph Core (view, model, renderer) -->
  <path d="M 1120 710 L 1280 710" fill="none" stroke="#34d399" stroke-width="3.5" marker-end="url(#depGreen)"/>
  <!-- 10. Sidebar.js ➔ Graph.js (miniaturas SVG) -->
  <path d="M 1240 370 C 1220 540 1150 630 1080 660" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#depIndigo)"/>
  <!-- 11. Format.js ➔ Graph.js (inspección de selección) -->
  <path d="M 1220 485 C 1190 560 1140 620 1080 660" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#depIndigo)"/>

  <!-- 12. DrawioFile.js ➔ DrawioFileSync.js (Delta Sync) -->
  <path d="M 900 930 L 1080 930" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#depAmber)"/>
  <!-- 13. DrawioFile.js ➔ mxGraphModel (beginUpdate / patchCells) -->
  <path d="M 850 870 C 920 830 1000 790 1030 760" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#depAmber)"/>
  <!-- 14. Clientes Nube ➔ DrawioFile.js (instanciación de archivos) -->
  <path d="M 470 850 L 720 910" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#depAmber)"/>

  <!-- 15. Clientes Nube ➔ AbsAuth / Servlets Java (Peticiones OAuth) -->
  <path d="M 380 890 C 420 1020 560 1070 700 1080" fill="none" stroke="#fb7185" stroke-width="3" marker-end="url(#depRose)"/>
  <!-- 16. App.js / Frontend ➔ ProxyServlet.java (CORS Bypass) -->
  <path d="M 560 550 C 480 690 620 1010 820 1060" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#depRose)"/>
  <!-- 17. EditorUi.js ➔ ExportProxyServlet.java (Descargas) -->
  <path d="M 940 410 C 970 560 1020 940 980 1050" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#depRose)"/>


  <!-- ================= NODOS / CONSTELACIÓN DE COMPONENTES ================= -->

  <!-- NODO 1: bootstrap.js (Arranque) -->
  <g transform="translate(130, 190)" filter="url(#meshShadow)">
    <rect width="200" height="75" rx="10" fill="#0c233c" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="14" y="24" font-size="13" font-weight="800" fill="#7dd3fc">js/bootstrap.js</text>
    <text x="14" y="44" font-size="10" fill="#cbd5e1">• Parsea urlParams &amp; hash #P{...}</text>
    <text x="14" y="60" font-size="10" fill="#94a3b8">• Detección mxIsElectron</text>
  </g>

  <!-- NODO 2: index.html & main.js -->
  <g transform="translate(130, 330)" filter="url(#meshShadow)">
    <rect width="200" height="90" rx="10" fill="#0c233c" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="14" y="24" font-size="13" font-weight="800" fill="#7dd3fc">index.html &amp; main.js</text>
    <text x="14" y="44" font-size="10" fill="#cbd5e1">• Contenedor DOM #geInfo</text>
    <text x="14" y="60" font-size="10" fill="#cbd5e1">• Listener window 'load'</text>
    <text x="14" y="76" font-size="10" fill="#38bdf8" font-weight="700">➔ Dispara App.main()</text>
  </g>

  <!-- ================= GRAN HUB CENTRAL: App.js (diagramly/App.js) ================= -->
  <g transform="translate(590, 480)" filter="url(#hubGlowCyan)">
    <circle r="75" fill="#082f49" stroke="#38bdf8" stroke-width="3.5"/>
    <circle r="52" fill="#0284c7"/>
    <text x="0" y="-8" font-size="17" font-weight="900" fill="#ffffff" text-anchor="middle">App.js</text>
    <text x="0" y="10" font-size="10" font-weight="700" fill="#e0f2fe" text-anchor="middle">HUB MAESTRO</text>
    <text x="0" y="26" font-size="9" fill="#bae6fd" text-anchor="middle">Controlador Global</text>
  </g>

  <!-- NODO 3: EditorUi.js (grapheditor/EditorUi) -->
  <g transform="translate(850, 310)" filter="url(#meshShadow)">
    <rect width="210" height="100" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <text x="16" y="26" font-size="14" font-weight="800" fill="#c7d2fe">EditorUi.js</text>
    <text x="16" y="46" font-size="10.5" fill="#e0e7ff">• Ensamblador físico del layout</text>
    <text x="16" y="64" font-size="10.5" fill="#cbd5e1">• Gestor de temas y páginas</text>
    <text x="16" y="82" font-size="10" fill="#a5b4fc" font-weight="700">Invoca: Menus, Sidebar, Format</text>
  </g>

  <!-- NODOS SATÉLITE DE UI (Menus, Sidebar, Format) -->
  <g transform="translate(1150, 180)" filter="url(#meshShadow)">
    <rect width="180" height="60" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#c7d2fe">Menus.js &amp; Actions.js</text>
    <text x="12" y="42" font-size="10" fill="#cbd5e1">Árbol de menús y atajos</text>
  </g>

  <g transform="translate(1180, 290)" filter="url(#meshShadow)">
    <rect width="180" height="70" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#c7d2fe">Sidebar.js &amp; Shapes.js</text>
    <text x="12" y="40" font-size="10" fill="#cbd5e1">Paletas de figuras</text>
    <text x="12" y="56" font-size="9" fill="#a5b4fc">Miniaturas SVG &amp; Drag/Drop</text>
  </g>

  <g transform="translate(1150, 400)" filter="url(#meshShadow)">
    <rect width="180" height="65" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#c7d2fe">Format.js</text>
    <text x="12" y="40" font-size="10" fill="#cbd5e1">Inspector reactivo de estilos</text>
    <text x="12" y="54" font-size="9" fill="#a5b4fc">Color, trazos, tipografía</text>
  </g>

  <!-- NODO 4: Editor.js (grapheditor/Editor) -->
  <g transform="translate(680, 660)" filter="url(#meshShadow)">
    <rect width="170" height="85" rx="10" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.8"/>
    <text x="14" y="24" font-size="13" font-weight="800" fill="#99f6e4">Editor.js</text>
    <text x="14" y="44" font-size="10" fill="#cbd5e1">• Estado del documento</text>
    <text x="14" y="60" font-size="10" fill="#cbd5e1">• UndoManager (Historial)</text>
    <text x="14" y="74" font-size="9" fill="#5eead4">setModified(true/false)</text>
  </g>

  <!-- NODO 5: Graph.js (Extensión avanzada) -->
  <g transform="translate(980, 660)" filter="url(#meshShadow)">
    <rect width="180" height="85" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="14" y="24" font-size="14" font-weight="800" fill="#a7f3d0">Graph.js</text>
    <text x="14" y="44" font-size="10.5" fill="#cbd5e1">• Extiende mxGraph</text>
    <text x="14" y="60" font-size="10" fill="#cbd5e1">• Atajos y auto-conexiones</text>
    <text x="14" y="74" font-size="9" fill="#34d399">Sanitización HTML y SVG</text>
  </g>

  <!-- ================= GRAN HUB CORE: mxGraph Core Library ================= -->
  <g transform="translate(1380, 710)" filter="url(#hubGlowGreen)">
    <circle r="80" fill="#022c22" stroke="#34d399" stroke-width="3.5"/>
    <circle r="56" fill="#059669"/>
    <text x="0" y="-10" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">mxGraph</text>
    <text x="0" y="8" font-size="11" font-weight="800" fill="#d1fae5" text-anchor="middle">CORE MOTOR</text>
    <text x="0" y="24" font-size="9" fill="#a7f3d0" text-anchor="middle">Model, View, SvgCanvas</text>
    <text x="0" y="38" font-size="8" fill="#6ee7b7" text-anchor="middle">mxCell(0,1), beginUpdate</text>
  </g>

  <!-- NODO 6: Clientes de Nube (DriveClient, GitHubClient...) -->
  <g transform="translate(240, 780)" filter="url(#meshShadow)">
    <rect width="230" height="110" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.8"/>
    <text x="14" y="24" font-size="13" font-weight="800" fill="#7dd3fc">Cloud Storage Clients</text>
    <text x="14" y="44" font-size="10.5" fill="#cbd5e1">• DriveClient.js (Google Drive)</text>
    <text x="14" y="60" font-size="10.5" fill="#cbd5e1">• GitHubClient &amp; GitLabClient</text>
    <text x="14" y="76" font-size="10.5" fill="#cbd5e1">• OneDriveClient &amp; DropboxClient</text>
    <text x="14" y="94" font-size="9" fill="#38bdf8">Controladores REST y Tokens</text>
  </g>

  <!-- NODO 7: DrawioFile.js (Persistencia & Merge) -->
  <g transform="translate(730, 880)" filter="url(#meshShadow)">
    <rect width="210" height="105" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
    <text x="16" y="26" font-size="14" font-weight="800" fill="#fde68a">DrawioFile.js</text>
    <text x="16" y="46" font-size="10.5" fill="#fef3c7">• Abstracción unificada de archivo</text>
    <text x="16" y="64" font-size="10.5" fill="#cbd5e1">• <tspan fill="#facc15" font-weight="700">shadowPages</tspan> (copia base)</text>
    <text x="16" y="80" font-size="10" fill="#cbd5e1">• <tspan fill="#facc15" font-weight="700">mergeFile()</tspan> (3-Way Merge)</text>
    <text x="16" y="95" font-size="9" fill="#fde047">autosaveDelay = 1500ms</text>
  </g>

  <!-- NODO 8: DrawioFileSync.js & DiffSync.js -->
  <g transform="translate(1080, 890)" filter="url(#meshShadow)">
    <rect width="200" height="80" rx="10" fill="#311302" stroke="#d97706" stroke-width="1.5"/>
    <text x="14" y="24" font-size="13" font-weight="700" fill="#fde68a">DrawioFileSync &amp; DiffSync</text>
    <text x="14" y="44" font-size="10" fill="#cbd5e1">• Colaboración en tiempo real</text>
    <text x="14" y="60" font-size="10" fill="#cbd5e1">• WebSocket, WebRTC y P2P</text>
    <text x="14" y="74" font-size="9" fill="#fde047">Deltas JSON en caliente</text>
  </g>

  <!-- ================= GRAN BASE: BACKEND JAVA SERVLETS ================= -->
  <g transform="translate(680, 1050)" filter="url(#meshShadow)">
    <rect width="450" height="90" rx="12" fill="#38091a" stroke="#fb7185" stroke-width="2.5"/>
    <text x="24" y="26" font-size="14" font-weight="800" fill="#fecdd3">BACKEND JAVA (src/main/java/.../online/)</text>
    <text x="24" y="46" font-size="10.5" fill="#ffe4e6">• <tspan fill="#ffffff" font-weight="700">AbsAuth / GitHubAuth / GoogleAuth:</tspan> Custodia secreta de tokens OAuth.</text>
    <text x="24" y="62" font-size="10.5" fill="#ffe4e6">• <tspan fill="#ffffff" font-weight="700">ProxyServlet (/proxy):</tspan> Pasarela CORS y protección contra SSRF.</text>
    <text x="24" y="78" font-size="10.5" fill="#ffe4e6">• <tspan fill="#ffffff" font-weight="700">ExportProxyServlet (/export):</tspan> Forzado de descarga Content-Disposition.</text>
  </g>

  <!-- ================= NOTA EXPLICATIVA DE ARQUITECTURA EN MALLA ================= -->
  <g transform="translate(60, 1150)">
    <text x="0" y="25" font-size="11" fill="#94a3b8">
      <tspan font-weight="700" fill="#38bdf8">Topología Clave:</tspan> El sistema pivota sobre 2 núcleos masivos: <tspan fill="#38bdf8" font-weight="700">App.js</tspan> (controlador supremo de la sesión y del flujo web) y <tspan fill="#34d399" font-weight="700">mxGraph</tspan> (motor de geometría matemática pura). Toda la persistencia converge en <tspan fill="#facc15" font-weight="700">DrawioFile</tspan>, mientras que el <tspan fill="#fb7185" font-weight="700">Backend Java</tspan> opera como una pasarela periférica stateless para eludir CORS y custodiar secretos OAuth.
    </text>
  </g>
</svg>